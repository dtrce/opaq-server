[package]
name = "opaq-server"
version = "0.1.0"
edition = "2021"
description = "Self-hosted config and secret store server"
license = "MIT"
repository = "https://github.com/dtrce/opaq-server"
authors = ["Dipen Javia <javia3@gmail.com>"]
rust-version = "1.75"
publish = false

[[bin]]
name = "opaq-server"
path = "src/main.rs"

[dependencies]
salvo = { version = "0.76", features = ["affix-state"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
regex-lite = "0.1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
